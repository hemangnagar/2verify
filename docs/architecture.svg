<path d="M1200 340 L1230 686" class="edge"/><text x="1204" y="356" class="lbl">SMTP</text>
<path d="M188 888 V752" class="edge" marker-end="url(#a)"/><text x="194" y="848" class="lbl">HTTPS / CSV</text>
<path d="M501 888 V752" class="edge" marker-end="url(#a)"/><text x="507" y="848" class="lbl">HTTPS / API</text>
<path d="M814 888 V752" class="edge" marker-end="url(#a)"/><text x="820" y="848" class="lbl">Chromium</text>
<path d="M1127 888 V752" class="edge" marker-end="url(#a)"/><text x="1133" y="848" class="lbl">human in a browser</text>
</svg>