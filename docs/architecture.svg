<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1354" viewBox="0 0 1600 1354" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<style>.box{fill:#fff;stroke:#334155;stroke-width:1.3;rx:8}.zone{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:6 4;rx:12}.ext{fill:#fff7ed;stroke:#c2410c;stroke-width:1.3;rx:8}.data{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.3;rx:8}.title{font-size:16px;font-weight:700;fill:#0f172a}.h{font-size:13px;font-weight:700;fill:#0f172a}.t{fill:#334155}.s{fill:#64748b;font-size:11.5px}.no{fill:#b91c1c}.zl{font-size:12px;font-weight:700;fill:#475569;letter-spacing:.06em}.edge{stroke:#475569;stroke-width:1.3;fill:none;marker-end:url(#a)}.lbl{fill:#475569;font-size:11px}</style></defs>
<rect width="1600" height="1354" fill="#ffffff"/>
<rect x="24" y="80" width="332" height="224" class="zone"/><text x="38" y="98" class="zl">USERS</text>
<rect x="380" y="80" width="820" height="672" class="zone"/><text x="394" y="98" class="zl">APP CONTAINER — Next.js 15 on Node 22, one process serves UI and API</text>
<rect x="1230" y="80" width="346" height="736" class="zone"/><text x="1244" y="98" class="zl">DATA</text>
<rect x="24" y="856" width="1552" height="280" class="zone"/><text x="38" y="874" class="zl">EXTERNAL SOURCES (all free; reached from the app and cron containers)</text>
<rect x="24" y="1160" width="1552" height="174" class="zone"/><text x="38" y="1178" class="zl">DEPLOYMENT (docker-compose.yml): five containers on one host</text>
<text x="24" y="34" class="title">2Verify — what is actually running (Oct 2026)</text>
<text x="24" y="54" class="s">One Node.js app, one Postgres, one object store, one cron container. No Kafka, no Kubernetes, no Redis, no message queue, no serverless, no microservices.</text>
<rect x="40" y="112" width="300" height="176" class="box"/>
<text x="52" y="132" class="h">Users (browser)</text>
<text x="52" y="150" class="t">Operator (2Verify staff): /ops console,</text>
<text x="52" y="166" class="t">switch into any org</text>
<text x="52" y="182" class="t">Org admin (customer): dashboard, records,</text>
<text x="52" y="198" class="t">usage, settings</text>
<text x="52" y="214" class="t">Verifier: queue and guided workbench;</text>
<text x="52" y="230" class="t">read-only elsewhere</text>
<text x="52" y="246" class="s">All in a normal browser over HTTPS. No</text>
<text x="52" y="262" class="s">native or mobile app.</text>

<rect x="396" y="112" width="386" height="240" class="box"/>
<text x="408" y="132" class="h">Frontend (server-rendered React)</text>
<text x="408" y="150" class="t">Next.js 15 App Router, React 19 server components,</text>
<text x="408" y="166" class="t">Tailwind 4, shadcn/ui (vendored).</text>
<text x="408" y="182" class="t">Pages: dashboard, credentials, people, locations,</text>
<text x="408" y="198" class="t">verify queue + workbench, screening + match review,</text>
<text x="408" y="214" class="t">reports, usage, audit, settings, /ops.</text>
<text x="408" y="230" class="t">Client-side JS only for forms, paste-screenshot, copy</text>
<text x="408" y="246" class="t">buttons.</text>
<text x="408" y="262" class="t">Auth: email + bcrypt password, signed JWT cookie</text>
<text x="408" y="278" class="t">(jose). Roles operator / org_admin / verifier.</text>
<text x="408" y="294" class="t">Files never served directly: 10-minute signed URLs via</text>
<text x="408" y="310" class="t">/api/files.</text>
<text x="408" y="326" class="s">middleware.ts redirects anonymous requests to /login.</text>
<rect x="798" y="112" width="386" height="288" class="box"/>
<text x="810" y="132" class="h">Backend (same process)</text>
<text x="810" y="150" class="t">Same Node process: server actions + route handlers</text>
<text x="810" y="166" class="t">(/api/files, /api/reports).</text>
<text x="810" y="182" class="t">db.ts: Prisma 6 client with two extensions: org scoping</text>
<text x="810" y="198" class="t">(every read/write filtered to the org in context) and</text>
<text x="810" y="214" class="t">audit (every mutation writes audit_log).</text>
<text x="810" y="230" class="t">verifications.ts: verification row + 1-credit debit in</text>
<text x="810" y="246" class="t">one transaction.</text>
<text x="810" y="262" class="t">boards/: Texas adapter on headless Chromium</text>
<text x="810" y="278" class="t">(playwright-core).</text>
<text x="810" y="294" class="t">screening.ts: LEIE/SAM matching (Jaro-Winkler, DOB</text>
<text x="810" y="310" class="t">rule). nppes.ts: NPI lookup.</text>
<text x="810" y="326" class="t">nightly.ts: status recompute + alerts. reports.ts: PDF</text>
<text x="810" y="342" class="t">(pdfkit), ZIP (jszip), CSV.</text>
<text x="810" y="358" class="t">pricing.ts: plans, $400/state, usage, overage.</text>
<text x="810" y="374" class="t">email.ts: nodemailer. storage.ts: S3 or local.</text>
<rect x="396" y="416" width="788" height="160" class="box"/>
<text x="408" y="436" class="h">Cron container (same Docker image, plain crond; no queue, no workers)</text>
<text x="408" y="454" class="t">02:00 daily — jobs/nightly.ts, per org: run enabled board adapters for due credentials, recompute status, send</text>
<text x="408" y="470" class="t">90/60/30/7-day, overdue and verify-due emails. Idempotent.</text>
<text x="408" y="486" class="t">03:00 on the 1st — jobs/screening.ts --source oig_leie: download LEIE CSV, match roster, store PDF report, email</text>
<text x="408" y="502" class="t">admins. Free (no credits).</text>
<text x="408" y="518" class="t">03:30 on the 1st — jobs/screening.ts --source sam: same via SAM.gov Exclusions API (SAM_API_KEY).</text>
<text x="408" y="534" class="s">In-process loops are enough for hundreds of orgs. A queue (BullMQ on Redis) only becomes worth it if a job outgrows</text>
<text x="408" y="550" class="s">the night.</text>
<rect x="396" y="592" width="788" height="160" class="box"/>
<text x="408" y="612" class="h">Headless browser (inside the app and cron containers)</text>
<text x="408" y="630" class="t">playwright-core launches Chromium per lookup (PW_CHROMIUM_PATH or the image's bundled browser). 20 s timeout, one</text>
<text x="408" y="646" class="t">retry, 1 query / 5 s per board, descriptive User-Agent.</text>
<text x="408" y="662" class="t">Adapters live in code (src/lib/boards) and are enabled per (state, credential type) by a board_adapter row. Today: TX</text>
<text x="408" y="678" class="t">pharmacy permits.</text>
<text x="408" y="694" class="t">Never bypasses a CAPTCHA or bot challenge. California (Cloudflare human check) and all other boards stay on the</text>
<text x="408" y="710" class="t">guided workbench.</text>
<text x="408" y="726" class="s">Docker image: node:22-bookworm-slim + Chromium (moved off Alpine for this). Next standalone build (server.js).</text>

<rect x="1246" y="112" width="314" height="304" class="data"/>
<text x="1258" y="132" class="h">PostgreSQL 16 (one database)</text>
<text x="1258" y="150" class="t">Prisma migrations (hand-edited where data</text>
<text x="1258" y="166" class="t">had to survive).</text>
<text x="1258" y="182" class="t">Platform: plan, org, org_jurisdiction, user.</text>
<text x="1258" y="198" class="t">Catalog (shared): credential_type,</text>
<text x="1258" y="214" class="t">board_lookup, board_adapter.</text>
<text x="1258" y="230" class="t">Customer (org_id on every row): entity,</text>
<text x="1258" y="246" class="t">person, credential, alert, screening_run,</text>
<text x="1258" y="262" class="t">screening_match.</text>
<text x="1258" y="278" class="t">Insert-only via DB triggers: verification,</text>
<text x="1258" y="294" class="t">credit_ledger, audit_log.</text>
<text x="1258" y="310" class="s">Per-org uniqueness (email, NPI, DEA), one</text>
<text x="1258" y="326" class="s">primary entity per org, credential subject</text>
<text x="1258" y="342" class="s">CHECK. Deletes only under SET LOCAL</text>
<text x="1258" y="358" class="s">app.allow_wipe (seed-wipe).</text>
<text x="1258" y="374" class="s">Dev: local Postgres or Compose. Prod:</text>
<text x="1258" y="390" class="s">Compose volume or managed Postgres.</text>
<rect x="1246" y="432" width="314" height="208" class="data"/>
<text x="1258" y="452" class="h">Object storage (private bucket)</text>
<text x="1258" y="470" class="t">S3-compatible: MinIO (local), Cloudflare R2</text>
<text x="1258" y="486" class="t">or AWS S3 (prod). Private bucket, versioning</text>
<text x="1258" y="502" class="t">on.</text>
<text x="1258" y="518" class="t">Keys: {org}/{entity}/{table}/{row}/{timestam</text>
<text x="1258" y="534" class="t">p}-{file}.</text>
<text x="1258" y="550" class="t">Evidence screenshots + page text,</text>
<text x="1258" y="566" class="t">certificates, screening PDFs.</text>
<text x="1258" y="582" class="s">Object metadata stamped with verifier, time,</text>
<text x="1258" y="598" class="s">source URL. A local-disk driver exists for</text>
<text x="1258" y="614" class="s">dev.</text>
<rect x="1246" y="656" width="314" height="144" class="data"/>
<text x="1258" y="676" class="h">Email (outbound only)</text>
<text x="1258" y="694" class="t">SMTP via nodemailer: Mailpit (local), SES or</text>
<text x="1258" y="710" class="t">Resend (prod).</text>
<text x="1258" y="726" class="t">Alerts, monthly screening reports, operator</text>
<text x="1258" y="742" class="t">invites.</text>
<text x="1258" y="758" class="s">MAIL_DRIVER=log prints instead of sending</text>
<text x="1258" y="774" class="s">(tests, fixture demos).</text>

<rect x="40" y="888" width="297" height="144" class="ext"/>
<text x="52" y="908" class="h">NPPES NPI Registry</text>
<text x="52" y="926" class="t">Public JSON API, no key. On save and 'Re-</text>
<text x="52" y="942" class="t">check NPI': auto_api verification, JSON</text>
<text x="52" y="958" class="t">stored as evidence, 1 credit.</text>
<text x="52" y="974" class="s">NPPES_MODE=live | fixture | off. PECOS</text>
<text x="52" y="990" class="s">monthly match is planned (Phase 2), not</text>
<text x="52" y="1006" class="s">built.</text>
<rect x="353" y="888" width="297" height="144" class="ext"/>
<text x="365" y="908" class="h">OIG LEIE and SAM.gov</text>
<text x="365" y="926" class="t">LEIE: monthly CSV download. SAM: REST API</text>
<text x="365" y="942" class="t">v4 with a free key, one query per roster</text>
<text x="365" y="958" class="t">name. All active people, monthly, free.</text>
<text x="365" y="974" class="s">SCREENING_MODE=live | fixture. Synthetic</text>
<text x="365" y="990" class="s">extracts in prisma/fixtures drive the</text>
<text x="365" y="1006" class="s">demo.</text>
<rect x="666" y="888" width="297" height="144" class="ext"/>
<text x="678" y="908" class="h">Texas State Board of Pharmacy</text>
<text x="678" y="926" class="t">phy_zoom.asp?id={permit}&amp;type=1 opened in</text>
<text x="678" y="942" class="t">headless Chromium, parsed, screenshot +</text>
<text x="678" y="958" class="t">text stored, auto_board verification, 1</text>
<text x="678" y="974" class="t">credit.</text>
<text x="678" y="990" class="s">Probed 2026-10-21: no CAPTCHA, no scraping</text>
<text x="678" y="1006" class="s">clause. Live smoke test: RUN_LIVE_BOARD=1.</text>
<rect x="979" y="888" width="297" height="160" class="ext"/>
<text x="991" y="908" class="h">Other 50 boards, DEA, URAC</text>
<text x="991" y="926" class="t">Guided workbench: pre-built board URL,</text>
<text x="991" y="942" class="t">copy buttons, human reads the page and</text>
<text x="991" y="958" class="t">pastes a screenshot. manual_board</text>
<text x="991" y="974" class="t">verification, 1 credit, about 60 seconds.</text>
<text x="991" y="990" class="s">board_lookup seeded for NV, CA, AZ, TX,</text>
<text x="991" y="1006" class="s">OK, KS, MO. CA blocks bots with</text>
<text x="991" y="1022" class="s">Cloudflare; a human passes it.</text>
<rect x="1292" y="888" width="297" height="224" class="ext"/>
<text x="1304" y="908" class="h">Not built or not used</text>
<text x="1304" y="926" class="no">No Kafka, RabbitMQ, SQS, BullMQ or Redis.</text>
<text x="1304" y="942" class="no">No Kubernetes, ECS, Lambda or Vercel</text>
<text x="1304" y="958" class="no">functions.</text>
<text x="1304" y="974" class="no">No Stripe or payments, no SSO, no mobile</text>
<text x="1304" y="990" class="no">app.</text>
<text x="1304" y="1006" class="no">No browser extension (paste-screenshot</text>
<text x="1304" y="1022" class="no">instead).</text>
<text x="1304" y="1038" class="no">No PECOS, no CSV import yet (Phase 2), no</text>
<text x="1304" y="1054" class="no">LMS.</text>
<text x="1304" y="1070" class="s">Target: Docker Compose on one VPS, about</text>
<text x="1304" y="1086" class="s">$12/month.</text>

<rect x="40" y="1192" width="297" height="54" class="box"/><text x="52" y="1212" class="h">app</text><text x="52" y="1232" class="s">Next.js standalone, :3000</text>
<rect x="353" y="1192" width="297" height="54" class="box"/><text x="365" y="1212" class="h">cron</text><text x="365" y="1232" class="s">same image, crond + tsx jobs</text>
<rect x="666" y="1192" width="297" height="54" class="data"/><text x="678" y="1212" class="h">postgres</text><text x="678" y="1232" class="s">postgres:16-alpine, named volume</text>
<rect x="979" y="1192" width="297" height="54" class="data"/><text x="991" y="1212" class="h">minio + minio-init</text><text x="991" y="1232" class="s">private versioned bucket</text>
<rect x="1292" y="1192" width="297" height="54" class="data"/><text x="1304" y="1212" class="h">mailpit</text><text x="1304" y="1232" class="s">dev SMTP sink, UI :8025</text>
<text x="40" y="1266" class="t">Production swaps are environment-only: minio to R2/S3, mailpit to SES/Resend, postgres to a managed instance via DATABASE_URL. TLS terminates at a reverse proxy (Caddy or nginx) in front of app:3000; that proxy is not in the repo</text>
<text x="40" y="1282" class="t">yet.</text>
<text x="40" y="1298" class="t">Tests: Vitest unit (status, alerts, matching, pricing, parser), Vitest integration on the DB (org isolation, ledger, adapter apply path), Playwright end-to-end walkthrough (11 tests). No CI configuration yet.</text>
<text x="40" y="1314" class="s">Operational gaps before a paying customer: backups, monitoring, reverse proxy with TLS.</text>

