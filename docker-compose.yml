# Local dev and single-host deploy. `make dev` brings everything up.
# Add -f docker-compose.tunnel.yml to publish it through a Cloudflare Tunnel (see docs/DEPLOY.md).
services:
  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/compliance
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      PW_CHROMIUM_PATH: ""
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    restart: unless-stopped

  cron:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/compliance
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      PW_CHROMIUM_PATH: ""
      SKIP_MIGRATE: "1"
    depends_on:
      app: { condition: service_healthy }
    entrypoint: ["/app/docker/cron/entrypoint.sh"]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: compliance
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compliance"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Creates the private evidence bucket with versioning on, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-compliance-evidence} &&
      mc version enable local/${S3_BUCKET:-compliance-evidence} &&
      mc anonymous set none local/${S3_BUCKET:-compliance-evidence}
      "

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025"]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
